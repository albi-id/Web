<!-- reset-password.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Restablecer contraseña</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:40px 20px;">
  <h2>Restableciendo tu contraseña...</h2>
  <p id="msg">Te estamos redirigiendo a la app.</p>
  <a id="fallback" href="#" style="display:none;color:#6388ba;font-size:18px;">Abrir en la app</a>

  <script>
    // El hash (#access_token=...&refresh_token=...) viene tal cual del link de Supabase
    var hash = window.location.hash; // incluye el "#"
    var appUrl = 'neos://reset-password' + hash;

    // Intento automático
    window.location.href = appUrl;

    // Si en 1.5s seguimos acá, mostramos el botón manual
    setTimeout(function () {
      document.getElementById('msg').innerText =
        'Si no se abrió la app automáticamente, tocá el botón:';
      var link = document.getElementById('fallback');
      link.href = appUrl;
      link.style.display = 'inline-block';
    }, 1500);
  </script>
</body>
</html>
